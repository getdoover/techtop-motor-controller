[project]
name = "techtop-motor-controller"
version = "0.1.0"
description = "Doover app that monitors and controls a Techtop TTA-3 (Invertek Optidrive E3) variable frequency drive over Modbus RTU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.16.2",
    "transitions>=0.9.2",
]

[project.scripts]
doover-app-run = "techtop_motor_controller:main"
export-config = "techtop_motor_controller.app_config:export"
export-ui = "techtop_motor_controller.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techtop_motor_controller"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
